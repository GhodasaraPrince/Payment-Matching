<p-card class="upload-card">
  <div class="upload-section">
    <div class="file-inputs">
      <div class="file-field">
        <span class="file-label">System CSV</span>
        <p-fileupload
          #systemUpload
          mode="basic"
          accept=".csv"
          chooseLabel="Choose file"
          chooseIcon="pi pi-file"
          [auto]="false"
          [multiple]="false"
          [maxFileSize]="9000000"
          (onSelect)="onSystemFileSelected($event)"
          (onError)="onFileUploadError()"
        />
        @if (systemFile()) {
          <span class="file-name"><i class="pi pi-check-circle"></i> {{ systemFile()!.name }}</span>
        }
      </div>

      <div class="file-field">
        <span class="file-label">Provider CSV</span>
        <p-fileupload
          #providerUpload
          mode="basic"
          accept=".csv"
          chooseLabel="Choose file"
          chooseIcon="pi pi-file"
          [auto]="false"
          [multiple]="false"
          [maxFileSize]="9000000"
          (onSelect)="onProviderFileSelected($event)"
          (onError)="onFileUploadError()"
        />
        @if (providerFile()) {
          <span class="file-name"><i class="pi pi-check-circle"></i> {{ providerFile()!.name }}</span>
        }
      </div>
    </div>

    <div class="action-row">
      <p-button
        label="Run Match"
        icon="pi pi-play"
        [loading]="loading()"
        [disabled]="!canRun()"
        (onClick)="runMatch()"
      />
      <p-button
        label="Reset"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        [disabled]="loading()"
        (onClick)="reset(); systemUpload.clear(); providerUpload.clear()"
      />
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" />
    }
  </div>
</p-card>

@if (summary(); as s) {
  <app-match-results-panel
    [summary]="s"
    [items]="items()"
    [filter]="filter()"
    [resolvingIds]="resolvingIds()"
    (filterChange)="onFilterChange($event)"
    (resolveItem)="onResolveItem($event)"
  />
}
